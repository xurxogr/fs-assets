[package]
name = "fs-assets"
version = "0.2.0"
edition = "2021"
# The oldest compiler that builds it (`File::try_lock`), checked with `cargo +1.89 check`.
rust-version = "1.89"
description = "Foxhole game asset tools: pak extraction, item catalog and icon-template database"
license = "MIT"
authors = ["Jorge García"]
repository = "https://github.com/xurxogr/fs-assets"
readme = "README.md"
keywords = ["foxhole", "pak", "uasset", "catalog", "game"]
# What goes into the source package (and the PyPI sdist): never local data.
include = [
    "/src/**/*.rs",
    "/python/**/*.py",
    "/python/**/*.pyi",
    "/python/**/py.typed",
    "/tests/python/*.py",
    "/Cargo.toml",
    "/Cargo.lock",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "fs-assets"
path = "src/main.rs"

[lib]
name = "fs_assets"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
unreal_asset = "0.1.16"
# Only PNG is needed: cooked Foxhole UI textures embed a ready-made PNG blob
# in the export tail (see src/convert/mod.rs::uasset_to_png doc comment) that
# we decode-then-re-encode for validation; no other codec is exercised.
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
# crates.io's "repak" name is squatted by an unrelated placeholder crate
# (a stub `add(left, right)` published 2025-02-16 with no relation to
# trumank/repak); the real repak only exists in-repo as a workspace
# member with no crates.io release, so it's pulled as a git dependency.
# It comes from a fork pinned to a commit: upstream sizes buffers straight
# from the pak's own headers (index size, entry counts, LZ4 lengths) and
# panics on bad UTF-16 names, so an untrusted mod pak could abort the
# process; the fork bounds those reads by the real data (see its commit
# 87c36e4) and moves to zstd 0.14.3 for the RustSec decompression advisories
# (commit 4c08090), and exposes entry sizes so an oversized entry can be
# refused before it is read into memory (commit 7849813).
repak = { git = "https://github.com/xurxogr/repak", rev = "784981318b6ca37f1c0f89f9bb5aed266329ad97" }
# Recursive directory walk for `pack`'s "directory -> .pak" input traversal.
walkdir = "2"
# SIMD substring search for `grep-strings`.
memchr = "2.8.2"
# Pure-Rust BC1/BC3/BC5/BC7 (DXT1/DXT5/BC5/BC7) block decoder for real cooked
# Texture2D mip chains (see uasset_to_png's compressed-mip-chain path).
# unreal_asset has no FTexturePlatformData support, so the container itself
# is hand-parsed from raw bytes; this crate only does the block-level pixel
# math, which was deliberately not hand-rolled.
texture2ddecoder = "0.1.2"
# The maintained fork of the `hdf5` crate (the original's last release, 0.8,
# bundles HDF5 1.10.7 from 2020), under the original names so the code still
# reads `hdf5::`.
hdf5 = { package = "hdf5-metno", version = "0.15" }
# Direct handle on hdf5-sys so the `static-hdf5` feature can build libhdf5 (and
# its zlib filter) from source. Unifies with the hdf5 crate's own hdf5-sys dep.
hdf5-sys = { package = "hdf5-metno-sys", version = "0.12" }
# Temporary workspace add-mod extracts a .pak into when given one directly.
tempfile = "3"
# Ctrl-C handler of the `fs-assets` binary, so an interrupted command stops at
# its next progress report and removes its temporary files.
ctrlc = "3"
# Warnings about inputs a run skips (an asset that fails to parse, an icon
# that fails to decode): the binary prints them to stderr, the Python module
# hands them to its `logging`.
log = "0.4"
# Python bindings (optional), mirroring fs-sav/fs-ocr's `python` feature.
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"], optional = true }

[features]
default = []
python = ["pyo3"]
# Build and statically link HDF5 from source instead of using the system
# libhdf5, so published wheels and binaries carry no external libhdf5. Local
# builds keep the system library (faster). Needs CMake and a C compiler.
static-hdf5 = ["hdf5-sys/static", "hdf5-sys/zlib"]

# Two allocation-count sites in unreal_asset panic on garbage/misaligned
# `Vec::with_capacity`/`IndexedMap::with_capacity` counts instead of
# surfacing a recoverable `Error`, plus one map-value struct-type ambiguity
# affecting large-ship blueprints (see the fork's commit f6872e7 for the
# fix), which together make several large-ship blueprints unreadable. The
# fork also caps property/Kismet nesting at 32 levels (commit e7829e4), so a
# crafted asset fails to parse instead of overflowing the stack, and moves to
# zstd 0.14.3 for the RustSec decompression advisories (commit 0300a3d).
[patch.crates-io]
unreal_asset = { git = "https://github.com/xurxogr/unrealmodding", rev = "0300a3d2f1e527ee52255e764121c8278290785a" }


[profile.release]
lto = true
strip = true

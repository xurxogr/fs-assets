repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-added-large-files

- repo: local
  hooks:
  - id: cargo-fmt
    name: cargo fmt
    entry: cargo fmt --
    language: system
    types: [rust]
    pass_filenames: false
  - id: cargo-clippy
    name: cargo clippy
    entry: cargo clippy --features python --all-targets -- -D warnings
    language: system
    types: [rust]
    pass_filenames: false
  - id: cargo-test
    name: cargo test
    entry: cargo test
    language: system
    types: [rust]
    pass_filenames: false
  - id: ruff-check
    name: ruff check
    entry: ruff check
    language: system
    types_or: [python, pyi]
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-format
    name: ruff format
    entry: ruff format
    language: system
    types_or: [python, pyi]
  - id: mypy
    name: mypy
    entry: mypy --strict python/fs_assets
    language: system
    types_or: [python, pyi]
    pass_filenames: false

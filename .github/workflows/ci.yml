name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust · fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --features python --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --locked --no-deps --features python
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Tests
        # Tests that need real game assets are #[ignore]d: those files are not
        # distributable.
        run: cargo test --locked

  python:
    name: python · wheel, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "1.15.0"
          args: --release --out dist
          sccache: "true"
          # Built on the runner against the system libhdf5; release wheels link
          # HDF5 statically instead.
          manylinux: "off"
      - name: Install wheel and test tools
        run: python -m pip install dist/*.whl pytest==9.2.0 mypy==2.4.1 ruff==0.17.3
      - name: Lint
        run: |
          ruff check python tests/python
          ruff format --check python tests/python
      - name: Type check
        run: |
          mypy --strict python/fs_assets
          python -m mypy.stubtest fs_assets._fs_assets
      - name: Tests
        run: pytest tests/python

  audit:
    name: audit · RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      # Built from crates.io rather than through a third-party action, so the
      # only extra code trusted is cargo-audit itself.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.1
      - name: Audit Cargo.lock
        run: cargo audit
